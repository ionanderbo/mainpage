<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ion Ander Bolado · Biomedical Engineering &amp; MedTech Translation</title>
  <meta name="description" content="Biomedical Engineering student at the University of Deusto in Bilbao building medical hardware, biosignal pipelines, and translational pathways from lab bench to bedside." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       Ion Ander Bolado — Personal Portfolio & Lab Log Design System
       Assimilated from CardioPatch UI Architecture · Distinct Fjord & Terracotta Palette
       ========================================================================== */
    :root {
      --bg-canvas: #ecefeb;
      --band-porcelain: #f8faf9;
      --band-sage: #e3ebe8;
      --band-mist: #edf1f4;
      --band-fjord: #0e3b40;
      --band-fjord-deep: #072226;
      --band-obsidian: #111619;

      --accent-teal: #0d7a6d;
      --accent-teal-deep: #09544b;
      --accent-signal: #d95d39;
      --accent-amber: #c97a16;
      --accent-crimson: #b8293d;

      --ink-primary: #12181b;
      --ink-secondary: #465258;
      --ink-muted: #6e7b82;
      --ink-inverse: #f8faf9;

      --border-subtle: rgba(18, 24, 27, 0.1);
      --border-light: rgba(248, 250, 249, 0.18);

      --radius-band: 36px;
      --radius-card: 24px;
      --radius-pill: 999px;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;

      --shadow-soft: 0 18px 48px rgba(18, 24, 27, 0.06);
      --shadow-elevated: 0 28px 64px rgba(18, 24, 27, 0.16);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 16px;
      min-height: 100vh;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent-signal);
      outline-offset: 3px;
    }

    .page-shell {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .display-hero {
      font-size: clamp(2.45rem, 5vw, 4.45rem);
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .display-section {
      font-size: clamp(1.85rem, 3.4vw, 2.85rem);
      font-weight: 700;
    }

    .serif-italic {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: rgba(13, 122, 109, 0.11);
      color: var(--accent-teal-deep);
    }

    .eyebrow--light {
      background: rgba(248, 250, 249, 0.14);
      color: var(--ink-inverse);
    }

    .eyebrow--signal {
      background: rgba(217, 93, 57, 0.14);
      color: #a83d1e;
    }

    /* Architectural Section Bands */
    .band {
      position: relative;
      border-radius: var(--radius-band);
      padding: clamp(32px, 5vw, 68px);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .band--fjord {
      background: radial-gradient(circle at 25% 20%, #15555c 0%, var(--band-fjord) 52%, var(--band-fjord-deep) 100%);
      color: var(--ink-inverse);
    }

    .band--porcelain { background: var(--band-porcelain); color: var(--ink-primary); }
    .band--sage { background: var(--band-sage); color: var(--ink-primary); }
    .band--mist { background: var(--band-mist); color: var(--ink-primary); }
    .band--obsidian { background: var(--band-obsidian); color: var(--ink-inverse); }

    .radial-rings {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 75% 48%, transparent 18%, rgba(255,255,255,0.05) 18.4%, transparent 18.8%),
        radial-gradient(circle at 75% 48%, transparent 34%, rgba(255,255,255,0.04) 34.4%, transparent 34.8%),
        radial-gradient(circle at 75% 48%, transparent 50%, rgba(255,255,255,0.03) 50.4%, transparent 50.8%);
    }

    /* Sticky Floating Pill Navbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-radius: var(--radius-pill);
      background: rgba(248, 250, 249, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      position: sticky;
      top: 12px;
      z-index: 90;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink-primary);
      font-weight: 800;
      font-size: 1.05rem;
    }

    .brand-pulse {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent-teal);
      box-shadow: 0 0 0 5px rgba(13, 122, 109, 0.2);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
    }

    .nav-link {
      text-decoration: none;
      color: var(--ink-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: var(--radius-pill);
      transition: color 0.25s ease;
    }

    .nav-link:hover {
      color: var(--ink-primary);
    }

    .menu-trigger {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--band-porcelain);
      color: var(--ink-primary);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .menu-trigger:hover {
      transform: scale(1.05);
    }

    /* Slide-Out Obsidian Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 22, 25, 0.55);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 120;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-drawer {
      position: fixed;
      top: 14px;
      left: 14px;
      bottom: 14px;
      width: min(390px, calc(100vw - 28px));
      background: var(--band-obsidian);
      color: var(--ink-inverse);
      border-radius: var(--radius-band);
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(-110%);
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 130;
    }

    .nav-drawer.open {
      transform: translateX(0);
    }

    .drawer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    .drawer-links a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink-inverse);
      font-size: 1.08rem;
      font-weight: 700;
      padding: 13px 18px;
      border-radius: 18px;
      border: 1px solid var(--border-light);
    }

    /* ==========================================================================
       Signature Animations (Assimilated from CardioPatch animations.css)
       ========================================================================== */
    @keyframes levitate {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .levitate-device {
      animation: levitate 4.6s ease-in-out infinite;
      will-change: transform;
    }

    /* Rolling Label Buttons + Directional Background Wipe */
    .btn-roll {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 26px;
      border-radius: var(--radius-pill);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease;
    }

    .btn-roll--primary { background: var(--ink-primary); color: var(--ink-inverse); }
    .btn-roll--teal { background: var(--accent-teal); color: #ffffff; }
    .btn-roll--signal { background: var(--accent-signal); color: #ffffff; }
    .btn-roll--light { background: var(--band-porcelain); color: var(--ink-primary); }
    .btn-roll--outline { background: transparent; color: inherit; border-color: currentColor; }

    .btn-wipe::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--accent-signal);
      transform: scaleX(0);
      transform-origin: right center;
      transition: transform 0.45s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: -1;
    }

    .btn-roll--signal.btn-wipe::before { background: var(--accent-teal); }
    .btn-roll--light.btn-wipe::before { background: var(--accent-signal); }
    .btn-roll--outline.btn-wipe::before { background: var(--ink-primary); }

    .btn-wipe:hover::before,
    .btn-wipe:focus-visible::before {
      transform: scaleX(1);
      transform-origin: left center;
    }

    .btn-roll--light.btn-wipe:hover,
    .btn-roll--outline.btn-wipe:hover {
      color: var(--ink-inverse);
    }

    .roll-track {
      position: relative;
      display: inline-block;
      overflow: hidden;
      height: 1.25em;
      line-height: 1.25em;
    }

    .roll-track > span {
      display: block;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .roll-track > span:nth-child(2) {
      position: absolute;
      left: 0;
      top: 100%;
    }

    .btn-roll:hover .roll-track > span,
    .btn-roll:focus-visible .roll-track > span {
      transform: translateY(-100%);
    }

    /* Nav Pill Wipe */
    .nav-wipe {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .nav-wipe::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(13, 122, 109, 0.12);
      border-radius: var(--radius-pill);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: -1;
    }

    .nav-wipe:hover::before {
      transform: scaleY(1);
    }

    /* Card Background Wipe */
    .card-wipe {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card-wipe::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(13, 122, 109, 0.05), rgba(217, 93, 57, 0.08));
      transform: translateY(101%);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: -1;
    }

    .card-wipe:hover {
      transform: translateY(-4px);
    }

    .card-wipe:hover::after {
      transform: translateY(0);
    }

    /* Scroll-Triggered Two-Tone Section Sweeps */
    .two-tone-sweep {
      position: relative;
    }

    .two-tone-sweep::before,
    .two-tone-sweep::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      transition: transform 0.9s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .two-tone-sweep::before {
      background: var(--accent-teal);
      transform: translateX(0%);
    }

    .two-tone-sweep::after {
      background: var(--band-sage);
      transform: translateX(0%);
      transition-delay: 0.12s;
    }

    .two-tone-sweep.is-revealed::before { transform: translateX(102%); }
    .two-tone-sweep.is-revealed::after { transform: translateX(-102%); }

    /* Focus and Enlarge on Hover */
    .focus-zoom-frame {
      position: relative;
      border-radius: var(--radius-card);
      overflow: hidden;
      transition:
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.35s ease;
    }

    .focus-zoom-group:hover .focus-zoom-frame {
      opacity: 0.76;
    }

    .focus-zoom-group .focus-zoom-frame:hover {
      opacity: 1;
      transform: scale(1.03);
      box-shadow: var(--shadow-elevated);
      z-index: 10;
    }

    /* ==========================================================================
       Layouts, Widgets & Project Modules
       ========================================================================== */
    .split-2 {
      display: grid;
      grid-template-columns: 1.06fr 0.94fr;
      gap: clamp(28px, 4.5vw, 60px);
      align-items: center;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 28px;
    }

    .band--obsidian .card,
    .band--fjord .card {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-light);
    }

    /* Hero CT Biopsy Card */
    .scan-panel {
      background: #0a171a;
      border: 1px solid rgba(248, 250, 249, 0.14);
      border-radius: 26px;
      padding: 18px 18px 14px;
      color: #a9c4d0;
      box-shadow: 0 24px 56px rgba(4, 14, 16, 0.45);
    }

    .scan-panel svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .scan-panel .path {
      stroke: var(--accent-signal);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
    }

    .scan-panel.go .path {
      animation: draw 2.1s cubic-bezier(0.6, 0, 0.2, 1) 0.4s forwards;
    }

    .scan-panel .tip {
      opacity: 0;
    }

    .scan-panel.go .tip {
      animation: pop 0.4s ease 2.4s forwards;
    }

    .scan-panel .ring {
      fill: none;
      stroke: var(--accent-signal);
      stroke-width: 2;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .scan-panel.go .ring {
      animation: ring 1.6s ease-out 2.5s 2;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { to { opacity: 1; } }
    @keyframes ring {
      0% { opacity: 0.9; transform: scale(1); }
      100% { opacity: 0; transform: scale(2.6); }
    }

    .readout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding-top: 10px;
      margin-top: 8px;
      border-top: 1px solid rgba(248, 250, 249, 0.1);
    }

    .readout b {
      color: #ffffff;
    }

    .mini-btn {
      background: rgba(248, 250, 249, 0.08);
      border: 1px solid rgba(248, 250, 249, 0.24);
      color: #ffffff;
      border-radius: var(--radius-pill);
      padding: 5px 14px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .mini-btn:hover {
      background: var(--accent-signal);
      border-color: var(--accent-signal);
    }

    /* Fact Stack in About */
    .fact-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fact-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent-teal);
      border-radius: 18px;
      padding: 18px 22px;
    }

    .fact-card--signal {
      border-left-color: var(--accent-signal);
    }

    .fact-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-teal-deep);
      margin-bottom: 4px;
    }

    .fact-card--
